name: Release

# Manually triggered publish to npm.
# Bumps the version, publishes to npm, tags the commit, and creates a
# GitHub release — all in one go. See CONTRIBUTING.md / README for usage.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Exact version to publish (e.g. 1.2.3). Leave blank to apply the
          semver bump selected below.
        required: false
        default: ""
      bump:
        description: Semver bump to apply (ignored when an exact version is given).
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Releases mutate the repo (commit + tag) and the npm registry, so never
# run two at once and never cancel one mid-flight.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only release from the default branch — keeps tags and the npm
    # registry aligned with what's on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      # registry-url writes an .npmrc entry that pnpm honors at publish
      # time; NODE_AUTH_TOKEN is supplied on the publish step below.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Bump version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_INPUT" ]; then
            if ! printf '%s' "$VERSION_INPUT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::'$VERSION_INPUT' is not a valid semver version"
              exit 1
            fi
            npm version "$VERSION_INPUT" --no-git-tag-version
          else
            npm version "$BUMP" --no-git-tag-version >/dev/null
          fi
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Only tag and release once npm accepts the package, so a failed
      # publish never leaves an orphan tag or release.
      - name: Commit, tag, and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # checkout detaches HEAD; (re)create a local main to commit on.
          git checkout -B main
          git add package.json
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes "Published type-a-bin@${NEW_VERSION} to npm: https://www.npmjs.com/package/type-a-bin/v/${NEW_VERSION}"
