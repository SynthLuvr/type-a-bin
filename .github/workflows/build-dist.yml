name: Build dist

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false # serialize; never cancel a mid-flight publish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build:lib # lib only — skip recursive packages build

      - name: Publish to dist branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp package.json "$stage/"
          cp -r dist "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cd "$stage"
          git init -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publish dist for $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
