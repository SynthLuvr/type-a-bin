packages:
  - "packages/*"

allowBuilds:
  "@ast-grep/cli": true
  esbuild: true

minimumReleaseAgeExclude:
  - ts-canon@0.1.2

# ts-canon >= 0.1.3 scopes its convert-to-arrow walk to node_modules-free
# directories and no longer needs this. 0.1.2 still emits single-star glob
# elements for files in node_modules-bearing directories, and pnpm's
# default workspace hoist turns the bin-test -> type-a-bin link into a
# symlink cycle that those elements walk until the heap is gone
# (SynthLuvr/ts-canon#9). Drop this setting when bumping past 0.1.2.
hoistWorkspacePackages: false

scriptShell: bash
